<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio</title>
  <script src="/static/go.js"></script>
  <link rel="icon" href="/static/studio.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="theme-color" content="#FBFAF7">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/post-ui.css">
  <link rel="stylesheet" href="/static/marks.css">
</head>
<body>
  <div class="shell" id="shell" data-half="review"></div>
  <div class="subnav" id="subnav">
    <nav class="tabs" id="tabs" aria-label="Review stages"></nav>
    <div class="menu tabs-menu" id="tabs-menu" role="menu" aria-label="More stages" hidden></div>
    <!-- Hidden until Studio knows there's more than one account (renderAccount): it flashed "Personal" on open
         (Bryan, 2026-10-23) while only Urban Makers is on. -->
    <div class="seg" id="brand-filter" role="group" aria-label="Account" hidden>
      <button data-brand="" class="on">All</button>
      <button data-brand="personal">Personal</button>
      <button data-brand="urban_makers">Urban Makers</button>
    </div>
  </div>

  <main>
    <p class="stage-hint" id="stage-hint"></p>
    <div class="stage-key" id="stage-key" hidden></div>
    <div class="toolbar" id="toolbar" hidden>
      <input id="idea-focus" type="text" maxlength="500" placeholder="Focus (optional), e.g. kitchen projects this month">
      <button class="btn primary" id="suggest">Suggest posts</button>
      <span class="muted" id="ideas-status"></span>
    </div>
    <div class="tidy-bar" id="tidy-bar" hidden></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <div class="sel-bar" id="sel-bar" role="region" aria-label="Picked clips" hidden></div>
    <section class="planner" id="planner" hidden></section>
  </main>

  <div class="viewer" id="viewer" hidden>
    <header class="detail-head" id="detail-head"></header>
    <div class="viewer-inner">
      <div class="player-col">
        <button class="nav prev" id="prev" title="Previous (K)" aria-label="Previous">&#8249;</button>
        <div class="player-frame" id="player-frame"></div>
        <button class="nav next" id="next" title="Next (J)" aria-label="Next">&#8250;</button>
        <div class="tile-meta" id="tile-meta"></div>
      </div>
      <aside class="panel" id="panel"></aside>
      <button type="button" class="viewer-help" data-help-open aria-label="Help: how this page works, Ask Studio, report a problem">Help</button>
      <button class="close" id="close" title="Close (Esc)" aria-label="Close">&times;</button>
    </div>
    <div class="decision-bar" id="decision-bar" hidden></div>
  </div>

  <div class="checklist" id="checklist" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close" data-modal-close title="Close (Esc)" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/shell.js"></script>
  <script src="/static/post-ui.js"></script>
  <script src="/static/marks.js"></script>
  <script src="/static/capture.js" async></script>
  <script src="/static/app.js"></script>
  <!-- Help and its look, fetched by shell.js the first time Help is pressed. -->
  <template id="studio-lazy"><script src="/static/help.js"></script><link rel="stylesheet" href="/static/help.css"></template>
</body>
</html>
