<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Studio planner</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><p class="noscript">Studio needs JavaScript.</p></noscript>

  <!-- Sign in, forgotten password, set a password from an invite or reset link -->
  <div class="auth" id="auth" hidden>
    <main class="auth-card" id="auth-card" aria-live="polite"></main>
  </div>

  <div id="app" hidden>
    <header class="top">
      <a class="brand-mark" href="#/" aria-label="Studio planner, back to the board">Studio <span class="brand-sub">Planner</span></a>
      <div class="filters">
        <div class="laptop" id="laptop">
          <button class="laptop-pill" id="laptop-btn" aria-haspopup="true" aria-expanded="false" aria-controls="laptop-info"><span class="dot"></span><span id="laptop-text">Studio laptop…</span></button>
          <div class="menu laptop-info" id="laptop-info" hidden></div>
        </div>
        <div class="account" id="account">
          <button class="account-btn" id="account-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"></button>
          <div class="menu" id="account-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="planner" id="planner" aria-label="Plan"></section>
      <section class="team-page" id="team" aria-label="Team" hidden></section>
    </main>

    <div class="viewer plan-mode" id="viewer" role="dialog" aria-modal="true" aria-label="Planned post" hidden>
      <div class="viewer-inner">
        <div class="player-col">
          <button class="nav prev" id="prev" title="Previous (K)" aria-label="Previous idea">&#8249;</button>
          <div class="player-frame" id="player-frame"></div>
          <button class="nav next" id="next" title="Next (J)" aria-label="Next idea">&#8250;</button>
        </div>
        <aside class="panel" id="panel"></aside>
        <button class="close" id="close" title="Close (Esc)" aria-label="Close">&times;</button>
      </div>
    </div>

    <div class="checklist" id="checklist" hidden></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close" data-modal-close title="Close (Esc)" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
