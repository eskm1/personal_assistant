<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Studio</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <noscript><p class="noscript">Studio needs JavaScript.</p></noscript>

  <!-- Sign in, forgotten password, set a password from an invite or reset link -->
  <div class="auth" id="auth" hidden>
    <main class="auth-card" id="auth-card" aria-live="polite"></main>
  </div>

  <div id="app" hidden>
    <div class="shell" id="shell" data-half="plan"></div>

    <main id="main">
      <section class="planner" id="planner" aria-label="Plan"></section>
      <section class="team-page" id="team" aria-label="Team" hidden></section>
      <section class="refs-page" id="refs" aria-label="References and style guide" hidden></section>
      <section class="month-page" id="month" aria-label="Content plan" hidden></section>
    </main>

    <div class="viewer plan-mode" id="viewer" role="dialog" aria-modal="true" aria-label="Planned post" hidden>
      <header class="viewer-head" id="viewer-head"></header>
      <div class="viewer-inner">
        <div class="player-col">
          <button class="nav prev" id="prev" title="Previous (K)" aria-label="Previous idea">&#8249;</button>
          <div class="player-frame" id="player-frame"></div>
          <button class="nav next" id="next" title="Next (J)" aria-label="Next idea">&#8250;</button>
        </div>
        <aside class="panel" id="panel"></aside>
        <button class="close" id="close" title="Close (Esc)" aria-label="Close">&times;</button>
      </div>
    </div>

    <div class="checklist" id="checklist" hidden></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close" data-modal-close title="Close (Esc)" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="shell.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
