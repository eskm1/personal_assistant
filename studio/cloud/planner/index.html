<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Studio</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="theme-color" content="#FBFAF7">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="post-ui.css">
  <!-- Every module at once, instead of one level of imports after another (far from the server, each level is a round trip). -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/core.js">
  <link rel="modulepreload" href="js/auth.js">
  <link rel="modulepreload" href="js/board.js">
  <link rel="modulepreload" href="js/home.js">
  <link rel="modulepreload" href="js/idea.js">
  <link rel="modulepreload" href="js/checklist.js">
  <link rel="modulepreload" href="js/team.js">
  <link rel="modulepreload" href="js/refs.js">
  <link rel="modulepreload" href="js/shoot.js">
  <link rel="modulepreload" href="js/month.js">
  <link rel="modulepreload" href="js/upload.js">
  <link rel="modulepreload" href="js/posting.js">
  <link rel="modulepreload" href="js/topics.js">
  <link rel="modulepreload" href="js/slides.js">
  <link rel="modulepreload" href="js/library.js">
  <link rel="modulepreload" href="js/refimport.js">
</head>
<body>
  <noscript><p class="noscript">Studio needs JavaScript.</p></noscript>

  <!-- Sign in, forgotten password, set a password from an invite or reset link -->
  <div class="auth" id="auth" hidden>
    <div class="auth-brand" aria-hidden="true"><span class="wordmark">URBAN MAKERS</span><span class="studio-tag">Studio</span></div>
    <main class="auth-card" id="auth-card" aria-live="polite"></main>
  </div>

  <div id="app" hidden>
    <div class="shell" id="shell" data-half="plan"></div>

    <main id="main">
      <section class="home" id="home" aria-label="Plan" hidden></section>
      <section class="planner" id="planner" aria-label="Ideas"></section>
      <section class="team-page" id="team" aria-label="Team" hidden></section>
      <section class="refs-page" id="refs" aria-label="References and style guide" hidden></section>
      <section class="month-page" id="month" aria-label="Content plan" hidden></section>
      <section class="post-page" id="posting" aria-label="Posting" hidden></section>
    </main>

    <div class="viewer plan-mode" id="viewer" role="dialog" aria-modal="true" aria-label="Planned post" hidden>
      <header class="viewer-head" id="viewer-head"></header>
      <div class="viewer-inner">
        <div class="player-col">
          <button class="nav prev" id="prev" title="Previous (K)" aria-label="Previous idea">&#8249;</button>
          <div class="player-frame" id="player-frame"></div>
          <button class="nav next" id="next" title="Next (J)" aria-label="Next idea">&#8250;</button>
        </div>
        <aside class="panel" id="panel"></aside>
        <button type="button" class="viewer-help" data-help-open aria-label="Help: how this page works, Ask Studio, report a problem">Help</button>
        <button class="close" id="close" title="Close (Esc)" aria-label="Close">&times;</button>
      </div>
    </div>

    <div class="checklist" id="checklist" hidden></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close" data-modal-close title="Close (Esc)" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="shell.js"></script>
  <script src="post-ui.js"></script>
  <script src="capture.js" async></script>
  <script type="module" src="js/app.js"></script>
  <!-- Help and its look, fetched by shell.js the first time Help is pressed. -->
  <template id="studio-lazy"><script src="help.js"></script><link rel="stylesheet" href="help.css"></template>
</body>
</html>
